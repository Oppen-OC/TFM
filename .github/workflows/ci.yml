name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      # Pytest no recorre directorios con punto: hay que darle la ruta. Valida el
      # registro de trampas y la deriva entre documentación y código.
      - name: Andamiaje de agentes
        run: uv run pytest .claude/tests

      # 30 comprobaciones sin red sobre parseo de fuentes y tracking. Guarda las
      # trampas cerradas del registro: si una cae, la ficha que la cita miente.
      - name: Selftest del demostrador
        run: uv run python demo/selftest.py

# Hiperparámetros del pipeline.
#
# Las claves de primer nivel son exactamente las que referencian los `params:`
# de cada stage en dvc.yaml. Si añades una clave aquí, DVC la considera una
# dependencia y reejecuta el stage cuando cambie.
#
# Este archivo NO contiene definiciones de stages. Eso vive en dvc.yaml.

prepare:
  # Umbrales del etiquetado (`etiquetado.Parametros`, qué hace cada uno en su
  # docstring). Las constantes del tracker (velocidad máxima, salto máximo,
  # hueco tolerado) viven en `tracking.py`: hasta 09/2026 había aquí copias que
  # ningún código leía.
  min_posiciones_viaje: 10       # posiciones fiables para que un tramo sea viaje
  min_fraccion_recorrido: 0.3    # y que recorra al menos esta parte del trazado
  retroceso_nuevo_viaje_m: 500   # la abscisa cae esto: el bus volvió a cabecera
  max_hueco_cruce_s: 120         # no se interpola un paso a través de más
  margen_cruce_m: 15             # un bus parado no «sale» de la parada por ruido
  paradas_referencia: 3          # primeras paradas que deciden el viaje programado
  max_desfase_s: 1200            # más lejos de todo viaje: refuerzo, no se asigna
  margen_min_s: 120              # ventaja mínima sobre el segundo viaje candidato
  min_avance: 0.8                # un trazado es candidato si el tramo avanza sobre él
  # Días de servicio que no se etiquetan: ningún horario que tengamos describe
  # lo que circuló (bitácora 024). El servicio de septiembre empezó el 31/08 y la
  # EMT no lo publicó, con calendario desde el 08/09, hasta el 10/09. Del 08 al
  # 11/09 ese horario existe pero solo en Transitland de pago: sin él se
  # etiquetaba con el de verano (ADR-014).
  excluir_fechas:
    - ["2026-08-31", "2026-09-11"]

features:
  objetivo: retraso_siguiente_parada_s
  horizonte_paradas: 1
  lags_min: [1, 5, 15]
  ventana_trafico_min: 10
  # La flota como sensor (bitácora 032): mediana del retraso ganado en el tramo
  # aguas abajo por otros buses que lo acabaron en los últimos N minutos.
  incluir_flota: true
  ventanas_flota_min: [5, 15]
  soporte_min: 2            # por debajo, no estimable (nulo), no cero
  incluir_trafico: false    # la capa 192 va después de la flota
  incluir_meteo: false     # sin fuente: no hay capa meteorológica capturada
  umbral_retraso_s: 300      # para la variante de clasificación binaria
  # Soporte para informar una línea con cifra propia: viajes y días de servicio
  # en la prueba, y los mismos viajes en entrenamiento. Por debajo se informa
  # agrupada, no se tira (ADR-018).
  linea_min_viajes: 100
  linea_min_dias: 3
  # Split TEMPORAL, nunca aleatorio: con series de posiciones, un split
  # aleatorio filtra el futuro en el entrenamiento y te da métricas falsas.
  # Captura hasta el 04/10: prueba de dos semanas enteras (21/09-04/10, lunes a
  # domingo); entrenamiento, agosto y la semana lectiva del 14 al 20/09 (ADR-007).
  test_desde: "2026-09-21"

train:
  # Brazo elegido por analysis/elegir_brazo.py en la validación (ADR-021).
  objective: reg:absoluteerror
  residuo: true             # aprender objetivo − retraso_s y sumarlo en predict
  eval_metric: mae          # la parada mira la métrica titular, no el RMSE
  n_estimators: 3000        # tope: con la parada por MAE, 800 se quedaba corto
  max_depth: 8
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 10
  early_stopping_rounds: 50
  n_jobs: -1
  random_state: 42
  # La parada temprana se mide en los últimos días del ENTRENAMIENTO, nunca en
  # la prueba: la semana del 14-20/09, de lunes a domingo como la prueba
  # (ADR-021). Con el número de árboles que sale, se reajusta con todo.
  dias_validacion: 7

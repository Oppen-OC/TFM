# Catálogo de mutantes dirigidos de la auditoría de tests.
#
# Cada mutante rompe a propósito UN invariante documentado: una trampa del
# registro, una regla de la documentación o una función sin cubrir. `mutar.py`
# lo aplica sobre un worktree desechable, corre la suite y clasifica:
#
#   detectado    algún test que pasaba deja de pasar
#   hueco        ningún test cae, pero una sonda de `sondas.py` ve salida distinta
#   equivalente  ningún test cae y ninguna sonda ve diferencia
#   invalido     `buscar` no aparece exactamente una vez: el mutante no se aplicó
#
# Campos:
#   id, nombre      identificador y lo que rompe, en una frase
#   capa            fuentes | tracking | persistencia | control
#   trampa          id de ficha en .claude/trampas/ (opcional). El runner lee su
#                   `test:` y comprueba que la guardia citada es de las que caen
#   fichero         ruta relativa a la raíz del repo
#   buscar          texto exacto, con saltos de línea LF; debe aparecer una vez
#   reemplazar      texto mutado
#   detector        tests que se ESPERA que lo detecten (sin parámetros). Vacío
#                   significa que no se espera ninguno: es un hueco previsto
#   sondas          sondas de `sondas.py` que ejercitan el código mutado
#   control         "nulo" o "positivo" en los dos controles del runner
#
# Añadir un mutante: que rompa algo que importe si se rompe de verdad, no un
# `<` por `<=` en un mensaje de log. Si nadie lo haría, no ayuda a nada.


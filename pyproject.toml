[project]
name = "tfm"
version = "0.1.0"
description = "tfm de Daniel Alpeñes"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139.1",
    "pandas>=2.3.3",
    "pydantic>=2.13.4",
    "scikit-learn>=1.7.2",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project"]

[project]
name = "tfm"
version = "0.1.0"
description = "tfm de Daniel Alpeñes"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.139.1",
    "httpx>=0.28.1",
    "mlflow>=3.14.0",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "requests>=2.32.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "streamlit>=1.40.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "dvc-gdrive>=3.0.1",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "nbclient>=0.11.0",
    "pytest",
    "ruff>=0.15.22",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project"]

[tool.ruff]
# Los notebooks de `notebooks/EDA/` quedan fuera del linter, no por dejadez:
# su cabecera tiene que manipular `sys.path` ANTES de importar `eda_utils`, lo
# que hace inevitable el E402, y deja puesto el cuarteto habitual de imports
# (pandas, numpy, matplotlib, seaborn) aunque un notebook concreto no llegue a
# usar alguno — quien abra el notebook a media exploración lo agradece.
# `eda_utils.py` sí se lintea: eso es código, no exploración.
extend-exclude = ["*.ipynb"]

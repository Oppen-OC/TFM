# Pipeline DVC del TFM.
#
# La INGESTA no es un stage y no debe serlo: capturar un stream en vivo no es
# idempotente ni reejecutable, que es justo lo que DVC asume de cada stage. El
# colector (`project/ingest/collect.py`) corre como proceso aparte y deja los datos
# crudos en `data/raw/`. El pipeline reproducible empieza ahí.
#
#   project/ingest/collect.py  ──(fuera de DVC, proceso largo)──>  data/raw/
#                                                            │
#   curar ──> prepare ──> disponibilidad ─────┐
#               ▲                             ├──> features ──┬──> train ──────────────> evaluate
#               │         tramos_ruta ────────┘               ├──> train_trafico ──────> evaluate_trafico       (ADR-024)
#               │             ▲                               └──> train_clasificador ─> evaluate_clasificador  (ADR-025)
#     data/raw/gtfs ──────────┘   (todas las versiones del feed; tramos_ruta lee además data/reference, ADR-017)
#
# features_h, train*_h y evaluate*_h repiten features y lo que cuelga de él para
# cada horizonte de `features.horizontes_barrido` (ADR-023).
# Mapa por etapa, con sus funciones y sus guardias: docs/12_flujo_de_datos.html
#
# Hasta 08/2026 el bloque `stages:` vivía en params.yaml y `dvc repro`
# simplemente no ejecutaba nada.

stages:
  curar:
    # Crudo -> curated: reparsea todos los payloads, deduplica sondeos y se
    # queda la captura más completa de cada uno (bitácoras 019 y 020). A
    # diferencia de la ingesta, esto SÍ es determinista y reejecutable. El
    # curated que escribe el colector en vivo es una vista previa; el que usa
    # el pipeline es este.
    cmd: uv run python -m project.ingest.reprocesar
    deps:
      - data/raw/source=emt_buses
      - data/raw/source=trafico_estado
      - data/raw/source=trafico_intensidad
      - data/raw/source=valenbisi
      - data/raw/source=renfe_cercanias
      - src/project/ingest/reprocesar.py
      - src/project/ingest/sources.py
    outs:
      - data/curated
    metrics:
      - metrics/curar.json:
          cache: false

  prepare:
    # Curated + GTFS (todas sus versiones) -> trayectorias con identidad de
    # vehículo, viajes observados y retraso por paso por parada.
    cmd: uv run python -m project.prepare
    deps:
      - data/curated
      - data/raw/gtfs
      - src/project/prepare.py
      - src/project/etiquetado.py
      - src/project/gtfs.py
      - src/project/mapmatching.py
      - src/project/tracking.py
    params:
      - prepare
    outs:
      - data/interim/emt_tracked
      - data/interim/viajes
      - data/interim/pasos
    metrics:
      - metrics/prepare.json:
          cache: false

  disponibilidad:
    # Cuándo se SABE cada paso: posiciones del viaje y llegada de su sondeo, y
    # la asignación del viaje (ADR-022). No depende del horizonte: se calcula una
    # vez para todo el barrido (ADR-023).
    cmd: uv run python -m project.features --disponibilidad
    deps:
      - data/interim/pasos
      - data/interim/emt_tracked
      - data/curated
      - src/project/features.py
    params:
      # t_disp repite lo que usa `cruces` y la asignación del viaje
      - prepare.max_hueco_cruce_s
      - prepare.paradas_referencia
    outs:
      - data/interim/disponibilidad

  tramos_ruta:
    # Qué tramos de la capa 192 cubren cada trozo de cada trazado, en cada
    # versión del GTFS (ADR-024). Geometría de data/reference (ADR-017).
    cmd: uv run python -m project.trafico
    deps:
      - data/reference/trafico_estado_geometria.parquet
      - data/raw/gtfs
      - src/project/trafico.py
      - src/project/gtfs.py
      - src/project/mapmatching.py
    params:
      - features.trafico_dist_max_m
      - features.trafico_largo_min_m
    outs:
      - data/interim/tramos_ruta

  features:
    cmd: uv run python -m project.features
    deps:
      - data/interim/pasos
      - data/interim/disponibilidad
      # el estado de la 192 en el recorrido que queda (ADR-024)
      - data/interim/tramos_ruta
      - data/curated
      - src/project/features.py
      - src/project/trafico.py
    params:
      - features
    outs:
      - data/processed/train.parquet
      - data/processed/test.parquet
    metrics:
      - metrics/features.json:
          cache: false

  train:
    cmd: uv run python -m project.train
    deps:
      - data/processed/train.parquet
      - src/project/train.py
      - src/project/features.py
      - src/project/predict.py
      - src/project/evaluate.py
    params:
      - train
    outs:
      - models/model.pkl

  evaluate:
    # El modelo contra los tres baselines, con la diferencia y su intervalo
    # remuestreando viajes (ADR-018), por grupo de soporte y por banda de
    # intervalo programado, que sale del GTFS (bitácora 038). El soporte de cada
    # línea cuenta sus viajes de entrenamiento.
    cmd: uv run python -m project.evaluate
    deps:
      - data/processed/train.parquet
      - data/processed/test.parquet
      - models/model.pkl
      - data/raw/gtfs
      - src/project/evaluate.py
      - src/project/predict.py
      - src/project/features.py
      - src/project/gtfs.py
    params:
      - features.objetivo
      - features.linea_min_viajes
      - features.linea_min_dias
    metrics:
      - metrics/eval.json:
          cache: false

  # El mismo modelo con la capa 192 (ADR-024): misma configuración y mismas
  # filas, solo cambian las variables. El de sin tráfico es el de `train`.
  train_trafico:
    cmd: uv run python -m project.train --trafico
    deps:
      - data/processed/train.parquet
      - src/project/train.py
      - src/project/features.py
      - src/project/predict.py
      - src/project/evaluate.py
    params:
      - train
    outs:
      - models/model_trafico.pkl

  evaluate_trafico:
    # Con tráfico menos sin tráfico sobre las mismas filas de la población, con
    # los intervalos por viajes y por días: en el estrato con sensor (la
    # primaria con h = 5), en conjunto, donde la capa veía congestión y sin
    # sensor (ADR-024, enmienda del 10/10). Sobre la prueba se ejecuta UNA vez.
    cmd: uv run python -m project.evaluate --trafico
    deps:
      - data/processed/test.parquet
      - models/model.pkl
      - models/model_trafico.pkl
      - src/project/evaluate.py
      - src/project/predict.py
      - src/project/features.py
    params:
      - features.objetivo
      - features.test_desde
      - features.test_hasta
    metrics:
      - metrics/trafico.json:
          cache: false

  # Barrido de horizontes (ADR-023): lo mismo que features, train y evaluate,
  # para cada horizonte de `features.horizontes_barrido`, en `…/h<h>/`.
  features_h:
    foreach: ${features.horizontes_barrido}
    do:
      cmd: uv run python -m project.features --horizonte ${item}
      deps:
        - data/interim/pasos
        - data/interim/disponibilidad
        - data/interim/tramos_ruta
        - data/curated
        - src/project/features.py
        - src/project/trafico.py
      params:
        - features
      outs:
        - data/processed/h${item}
      metrics:
        - metrics/horizontes/h${item}/features.json:
            cache: false

  train_h:
    foreach: ${features.horizontes_barrido}
    do:
      cmd: uv run python -m project.train --horizonte ${item}
      deps:
        - data/processed/h${item}
        - src/project/train.py
        - src/project/features.py
        - src/project/predict.py
        - src/project/evaluate.py
      params:
        - train
      outs:
        - models/h${item}/model.pkl

  evaluate_h:
    foreach: ${features.horizontes_barrido}
    do:
      cmd: uv run python -m project.evaluate --horizonte ${item}
      deps:
        - data/processed/h${item}
        - models/h${item}/model.pkl
        - data/raw/gtfs
        - src/project/evaluate.py
        - src/project/predict.py
        - src/project/features.py
        - src/project/gtfs.py
      params:
        - features.objetivo
        - features.linea_min_viajes
        - features.linea_min_dias
      metrics:
        - metrics/horizontes/h${item}/eval.json:
            cache: false

  train_trafico_h:
    foreach: ${features.horizontes_barrido}
    do:
      cmd: uv run python -m project.train --horizonte ${item} --trafico
      deps:
        - data/processed/h${item}
        - src/project/train.py
        - src/project/features.py
        - src/project/predict.py
        - src/project/evaluate.py
      params:
        - train
      outs:
        - models/h${item}/model_trafico.pkl

  evaluate_trafico_h:
    foreach: ${features.horizontes_barrido}
    do:
      cmd: uv run python -m project.evaluate --horizonte ${item} --trafico
      deps:
        - data/processed/h${item}
        - models/h${item}/model.pkl
        - models/h${item}/model_trafico.pkl
        - src/project/evaluate.py
        - src/project/predict.py
        - src/project/features.py
      params:
        - features.objetivo
        - features.test_desde
        - features.test_hasta
      metrics:
        - metrics/horizontes/h${item}/trafico.json:
            cache: false

  # Más de 5 min tarde (ADR-025): las variables y la configuración de la
  # regresión sin tráfico; solo cambia la pérdida. El umbral de decisión sale
  # de la validación y va dentro del modelo.
  train_clasificador:
    cmd: uv run python -m project.train --clasificador
    deps:
      - data/processed/train.parquet
      - src/project/train.py
      - src/project/features.py
      - src/project/predict.py
      - src/project/evaluate.py
    params:
      - train
      - features.umbral_retraso_s
    outs:
      - models/model_clasificador.pkl

  evaluate_clasificador:
    # Contra la persistencia, la del tramo y la regresión umbralizada sobre las
    # mismas filas de la población, con el titular en las bandas de más de 15
    # min (bitácora 038). Descriptivo. Sobre la prueba se ejecuta UNA vez.
    cmd: uv run python -m project.evaluate --clasificador
    deps:
      - data/processed/test.parquet
      - models/model.pkl
      - models/model_clasificador.pkl
      - data/raw/gtfs
      - src/project/evaluate.py
      - src/project/predict.py
      - src/project/features.py
      - src/project/gtfs.py
    params:
      - features.objetivo
      - features.umbral_retraso_s
      - features.test_desde
      - features.test_hasta
    metrics:
      - metrics/clasificador.json:
          cache: false

  train_clasificador_h:
    foreach: ${features.horizontes_barrido}
    do:
      cmd: uv run python -m project.train --horizonte ${item} --clasificador
      deps:
        - data/processed/h${item}
        - src/project/train.py
        - src/project/features.py
        - src/project/predict.py
        - src/project/evaluate.py
      params:
        - train
        - features.umbral_retraso_s
      outs:
        - models/h${item}/model_clasificador.pkl

  evaluate_clasificador_h:
    foreach: ${features.horizontes_barrido}
    do:
      cmd: uv run python -m project.evaluate --horizonte ${item} --clasificador
      deps:
        - data/processed/h${item}
        - models/h${item}/model.pkl
        - models/h${item}/model_clasificador.pkl
        - data/raw/gtfs
        - src/project/evaluate.py
        - src/project/predict.py
        - src/project/features.py
        - src/project/gtfs.py
      params:
        - features.objetivo
        - features.umbral_retraso_s
        - features.test_desde
        - features.test_hasta
      metrics:
        - metrics/horizontes/h${item}/clasificador.json:
            cache: false

  # Qué usa cada modelo (spec del 15/10): SHAP sobre una muestra fija de la
  # población de la prueba. Depende de las métricas de la evaluación para
  # correr DETRÁS de ella; es descriptivo y no cambia ninguna cifra.
  explicar:
    cmd: uv run python -m project.explicar
    deps:
      - data/processed/test.parquet
      - models/model.pkl
      - models/model_trafico.pkl
      - models/model_clasificador.pkl
      - metrics/eval.json
      - metrics/trafico.json
      - metrics/clasificador.json
      - src/project/explicar.py
      - src/project/predict.py
      - src/project/features.py
      - src/project/evaluate.py
    params:
      - features.test_desde
      - features.test_hasta
    metrics:
      - metrics/explicacion.json:
          cache: false
    outs:
      - figuras/shap/h1:
          cache: false

  explicar_h:
    foreach: ${features.horizontes_barrido}
    do:
      cmd: uv run python -m project.explicar --horizonte ${item}
      deps:
        - data/processed/h${item}
        - models/h${item}/model.pkl
        - models/h${item}/model_trafico.pkl
        - models/h${item}/model_clasificador.pkl
        - metrics/horizontes/h${item}/eval.json
        - metrics/horizontes/h${item}/trafico.json
        - metrics/horizontes/h${item}/clasificador.json
        - src/project/explicar.py
        - src/project/predict.py
        - src/project/features.py
        - src/project/evaluate.py
      params:
        - features.test_desde
        - features.test_hasta
      metrics:
        - metrics/horizontes/h${item}/explicacion.json:
            cache: false
      outs:
        - figuras/shap/h${item}:
            cache: false

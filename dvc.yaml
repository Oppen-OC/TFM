# Pipeline DVC del TFM.
#
# La INGESTA no es un stage y no debe serlo: capturar un stream en vivo no es
# idempotente ni reejecutable, que es justo lo que DVC asume de cada stage. El
# colector (`project/ingest/collect.py`) corre como proceso aparte y deja los datos
# crudos en `data/raw/`. El pipeline reproducible empieza ahí.
#
#   project/ingest/collect.py  ──(fuera de DVC, proceso largo)──>  data/raw/
#                                                            │
#            curar ──> prepare ──> features ──> train ──> evaluate
#                         ▲
#               data/raw/gtfs (todas las versiones del feed)
#
# Hasta 08/2026 el bloque `stages:` vivía en params.yaml y `dvc repro`
# simplemente no ejecutaba nada.

stages:
  curar:
    # Crudo -> curated: reparsea todos los payloads, deduplica sondeos y se
    # queda la captura más completa de cada uno (bitácoras 019 y 020). A
    # diferencia de la ingesta, esto SÍ es determinista y reejecutable. El
    # curated que escribe el colector en vivo es una vista previa; el que usa
    # el pipeline es este.
    cmd: uv run python -m project.ingest.reprocesar
    deps:
      - data/raw/source=emt_buses
      - data/raw/source=trafico_estado
      - data/raw/source=trafico_intensidad
      - data/raw/source=valenbisi
      - data/raw/source=renfe_cercanias
      - src/project/ingest/reprocesar.py
      - src/project/ingest/sources.py
    outs:
      - data/curated

  prepare:
    # Curated + GTFS (todas sus versiones) -> trayectorias con identidad de
    # vehículo, viajes observados y retraso por paso por parada.
    cmd: uv run python -m project.prepare
    deps:
      - data/curated
      - data/raw/gtfs
      - src/project/prepare.py
      - src/project/etiquetado.py
      - src/project/gtfs.py
      - src/project/mapmatching.py
      - src/project/tracking.py
    params:
      - prepare
    outs:
      - data/interim/emt_tracked
      - data/interim/viajes
      - data/interim/pasos
    metrics:
      - metrics/prepare.json:
          cache: false

  features:
    cmd: uv run python -m project.features
    deps:
      - data/interim/pasos
      - src/project/features.py
    params:
      - features
    outs:
      - data/processed/train.parquet
      - data/processed/test.parquet
    metrics:
      - metrics/features.json:
          cache: false

  train:
    cmd: uv run python -m project.train
    deps:
      - data/processed/train.parquet
      - src/project/train.py
      - src/project/features.py
      - src/project/predict.py
      - src/project/evaluate.py
    params:
      - train
    outs:
      - models/model.pkl

  evaluate:
    # El modelo contra los tres baselines, con la diferencia y su intervalo
    # remuestreando viajes (ADR-018), por grupo de soporte y por banda de
    # intervalo programado, que sale del GTFS (bitácora 038). El soporte de cada
    # línea cuenta sus viajes de entrenamiento.
    cmd: uv run python -m project.evaluate
    deps:
      - data/processed/train.parquet
      - data/processed/test.parquet
      - models/model.pkl
      - data/raw/gtfs
      - src/project/evaluate.py
      - src/project/predict.py
      - src/project/features.py
      - src/project/gtfs.py
    params:
      - features.objetivo
      - features.linea_min_viajes
      - features.linea_min_dias
    metrics:
      - metrics/eval.json:
          cache: false
